# Production stack: Django (gunicorn) behind Caddy, which handles HTTPS certificates automatically.
# Used by deploy.sh:  docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
name: sisuseth

services:
  web:
    build: ..
    env_file: ../.env
    volumes: ["sisuseth-data:/data"]          # SQLite database + uploaded photos/videos
    expose: ["8000"]                          # only reachable through Caddy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/content/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data                      # HTTPS certificates
      - caddy-config:/config
    depends_on: [web]
    restart: unless-stopped

volumes:
  sisuseth-data:
  caddy-data:
  caddy-config:
